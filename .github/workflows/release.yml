name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="sanemark-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="dist/${PKG_NAME}"
          mkdir -p "${ARCHIVE_DIR}"

          cp "target/${{ matrix.target }}/release/sanemark" "${ARCHIVE_DIR}/"
          if [ -f "target/${{ matrix.target }}/release/sanemark-lsp" ]; then
            cp "target/${{ matrix.target }}/release/sanemark-lsp" "${ARCHIVE_DIR}/"
          fi
          cp README.md LICENSE "${ARCHIVE_DIR}/"

          tar -czvf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="sanemark-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="dist/${PKG_NAME}"
          mkdir -p "${ARCHIVE_DIR}"

          cp "target/${{ matrix.target }}/release/sanemark.exe" "${ARCHIVE_DIR}/"
          if [ -f "target/${{ matrix.target }}/release/sanemark-lsp.exe" ]; then
            cp "target/${{ matrix.target }}/release/sanemark-lsp.exe" "${ARCHIVE_DIR}/"
          fi
          cp README.md LICENSE "${ARCHIVE_DIR}/"

          cd dist
          7z a "${PKG_NAME}.zip" "./${PKG_NAME}/*"
          certutil -hashfile "${PKG_NAME}.zip" SHA256 | findstr -v "hash" | findstr -v "CertUtil" | tr -d ' \r\n' > "${PKG_NAME}.zip.sha256"
          echo "  ${PKG_NAME}.zip" >> "${PKG_NAME}.zip.sha256"

      - name: Stage release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish-release:
    name: Publish complete release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check --strict *.sha256

      # Keep uploads invisible to extension clients until every asset is ready.
      # A failed upload leaves a draft that can be completed by rerunning the job.
      - name: Create or resume draft release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; refusing to modify it." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          fi

      - name: Upload all assets to draft
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false
