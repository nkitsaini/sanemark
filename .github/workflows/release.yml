name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="sanemark-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="dist/${PKG_NAME}"
          mkdir -p "${ARCHIVE_DIR}"

          cp "target/${{ matrix.target }}/release/sanemark" "${ARCHIVE_DIR}/"
          if [ -f "target/${{ matrix.target }}/release/sanemark-lsp" ]; then
            cp "target/${{ matrix.target }}/release/sanemark-lsp" "${ARCHIVE_DIR}/"
          fi
          cp README.md LICENSE "${ARCHIVE_DIR}/"

          tar -czvf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="sanemark-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="dist/${PKG_NAME}"
          mkdir -p "${ARCHIVE_DIR}"

          cp "target/${{ matrix.target }}/release/sanemark.exe" "${ARCHIVE_DIR}/"
          if [ -f "target/${{ matrix.target }}/release/sanemark-lsp.exe" ]; then
            cp "target/${{ matrix.target }}/release/sanemark-lsp.exe" "${ARCHIVE_DIR}/"
          fi
          cp README.md LICENSE "${ARCHIVE_DIR}/"

          7z a "dist/${PKG_NAME}.zip" "./${ARCHIVE_DIR}/*"
          cd dist
          certutil -hashfile "${PKG_NAME}.zip" SHA256 | findstr -v "hash" | findstr -v "CertUtil" | tr -d ' \r\n' > "${PKG_NAME}.zip.sha256"
          echo "  ${PKG_NAME}.zip" >> "${PKG_NAME}.zip.sha256"

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
